# Usage:
#   docker compose up app                 # start the demo at http://localhost:8501
#   docker compose run --rm app python cli.py ingest             # build the index
#   docker compose run --rm app python cli.py retrieve "early blight"
#   docker compose run --rm app python cli.py benchmark
#
# Live reload: the whole project is bind-mounted into /app, and Streamlit is launched
# with --server.runOnSave, so editing any source file on the host re-runs the app.

services:
  app:
    build: .
    image: crop-reflection-rag
    container_name: crop-reflection-rag
    ports:
      - "8501:8501"
    env_file:
      - .env                      # GEMINI_API_KEY etc.
    volumes:
      - .:/app                    # <- live code reload (host edits visible instantly)
      - /app/__pycache__          # don't sync stale bytecode back to the host
    environment:
      - PYTHONUNBUFFERED=1
    # Inherits the Dockerfile CMD (Streamlit with runOnSave + poll watcher).
    # The chroma_db/ index lives in the bind mount, so it persists on the host.
